[package]
name = "iceoryx2-link-conformance-tests"
description = "iceoryx2: conformance tests for link backends, carriers and adapters"
categories = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[features]
default = []
std = [
  "iceoryx2/std",
  "iceoryx2-bb-concurrency/std",
  "iceoryx2-bb-elementary/std",
  "iceoryx2-bb-posix/std",
  "iceoryx2-bb-testing/std",
  "iceoryx2-bb-testing-macros/std",
  "iceoryx2-link/std",
  "iceoryx2-link-backend/std",
  "iceoryx2-link-carrier/std",
  "iceoryx2-link-tunnel/std",
]

[[test]]
name = "tests"
harness = false

[dependencies]
iceoryx2 = { workspace = true }
iceoryx2-bb-concurrency = { workspace = true }
iceoryx2-bb-elementary = { workspace = true }
iceoryx2-bb-elementary-traits = { workspace = true }
iceoryx2-bb-posix = { workspace = true }
iceoryx2-bb-testing = { workspace = true }
iceoryx2-bb-testing-macros = { workspace = true }
iceoryx2-link = { workspace = true }
iceoryx2-link-backend = { workspace = true }
iceoryx2-link-carrier = { workspace = true }
iceoryx2-link-tunnel = { workspace = true }

[dev-dependencies]
iceoryx2-link-conformance-tests-common = { workspace = true, features = ["std"] }
