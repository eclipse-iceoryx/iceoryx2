[package]
name = "iceoryx2-pal-posix"
description = "iceoryx2: [internal] A posix layer that ensures uniform posix behavior on all platforms according to https://posix.opengroup.org"
categories = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

# We allow here unused dependencies since bindgen is not used
# on all platforms
[lints.cargo]
unused_dependencies = "allow"

[features]
std = [
  "iceoryx2-pal-concurrency-sync/std",
  "libc/std"
]

[build-dependencies]
cbindgen = { workspace = true }
cc = { version = "1.0.98" }
bindgen = { version = "0.72.1" }

[dependencies]
iceoryx2-pal-concurrency-sync = { workspace = true }
iceoryx2-pal-configuration = { workspace = true }

libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
