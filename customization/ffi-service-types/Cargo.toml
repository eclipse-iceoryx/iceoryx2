[package]
name = "iceoryx2-customization-ffi-service-types"
categories = ["network-programming"]
description = "iceoryx2 customization for FFI service types"
edition = "2024"
homepage = "https://iceoryx.io"
keywords = [
    "zero-copy",
    "communication",
    "ipc",
    "publish-subscribe",
    "request-response",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-iceoryx/iceoryx2"
rust-version = "1.89"
version = "0.0.2"

# the features are required in this crate in order to be able to forward them to the iceoryx2 crates in a custom implementation
[features]
default = []
std = []

[dependencies]

# adding empty workspace to prevent cargo to assume this package is in the workspace from git root
[workspace]
