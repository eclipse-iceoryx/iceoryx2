[package]
name = "iceoryx2-services-tunnel-host-to-host-tests"
description = "iceoryx2: [internal] binaries for tunnel host-to-host tests"
categories = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
readme = "../README.md"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[[bin]]
name = "tunnel-host-to-host-pinger"
path = "ping-pong/src/pinger.rs"

[[bin]]
name = "tunnel-host-to-host-ponger"
path = "ping-pong/src/ponger.rs"

[lib]
name = "iceoryx2_services_tunnel_host_to_host_tests"
path = "common/src/lib.rs"

[dependencies]
iceoryx2 = { workspace = true, features = ["std"] }
iceoryx2-log = { workspace = true, features = ["std"] }
iceoryx2-bb-container = { workspace = true, features = ["std"] }
iceoryx2-bb-posix = { workspace = true, features = ["std"] }

clap = { workspace = true }
