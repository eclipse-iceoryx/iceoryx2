[package]
name = "iceoryx2-ffi-service-types"
description = "iceoryx2: [internal] defines the services types for the language bindings"
categories = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

# We allow here unused dependencies since we need
# to use the definitions coming from the customization crate
# that is added as overriden dependency
[lints.cargo]
unused_dependencies = "allow"

[features]
default = ["std"]
std = [
  "iceoryx2/std",
]

[dependencies]
iceoryx2 = { workspace = true }
iceoryx2-customization-ffi-service-types = { version = "0.0.1" } # this needs to come from crates.io in order to make the patch mechanism work

[build-dependencies]
iceoryx2-customization-ffi-service-types = { version = "0.0.1" } # this needs to come from crates.io in order to make the patch mechanism work
