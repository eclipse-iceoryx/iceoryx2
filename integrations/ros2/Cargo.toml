# Made a standalone workspace to exclude from cargo builds of all integrations
# because the crates need a sourced ROS 2 environment to build.
[workspace]
resolver = "2"
members = [
    "interop",
    "link-adapter",
    "link-gateway-cli",
]
# Exclude the colcon workspace because its `ament_cargo` packages are built by colcon.
exclude = [
    "workspace",
]

[workspace.package]
categories = ["network-programming"]
description = "iceoryx2 integration with ROS 2"
edition = "2024"
homepage = "https://iceoryx.io"
keywords = [
    "zero-copy",
    "communication",
    "ipc",
    "publish-subscribe",
    "ros2",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eclipse-iceoryx/iceoryx2"
rust-version = "1.89"
version = "0.10.999"

[workspace.dependencies]
iceoryx2 = { version = "0.10.999", path = "../../iceoryx2/", features = ["std"] }
iceoryx2-bb-concurrency = { version = "0.10.999", path = "../../iceoryx2-bb/concurrency/", features = ["std"] }
iceoryx2-bb-testing = { version = "0.10.999", path = "../../iceoryx2-bb/testing/", features = ["std"] }
iceoryx2-cli = { version = "0.10.999", path = "../../iceoryx2-cli/" }
iceoryx2-integrations-ros2-interop = { version = "0.10.999", path = "interop" }
iceoryx2-integrations-ros2-link-adapter = { version = "0.10.999", path = "link-adapter" }
iceoryx2-log = { version = "0.10.999", path = "../../iceoryx2-log/log/", features = ["std"] }
iceoryx2-link-gateway = { version = "0.10.999", path = "../../iceoryx2-link/gateway", features = ["std"] }
iceoryx2-link = { version = "0.10.999", path = "../../iceoryx2-link/link", features = ["std"] }
iceoryx2-bb-testing-macros = { version = "0.10.999", path = "../../iceoryx2-bb/testing-macros/", features = ["std"] }
iceoryx2-link-conformance-tests = { version = "0.10.999", path = "../../iceoryx2-link/conformance-tests", features = ["std"] }
iceoryx2-link-adapter = { version = "0.10.999", path = "../../iceoryx2-link/adapter", features = ["std"] }
iceoryx2-link-backend = { version = "0.10.999", path = "../../iceoryx2-link/backend", features = ["std"] }

anyhow = { version = "1.0.86" }
better-panic = { version = "0.3.0" }
clap = { version = "4.6.1", features = ["derive"] }
getrandom = { version = "0.4" }
human-panic = { version = "2.0.5" }
libloading = { version = "0.8" }
r2r_rcl = { version = "0.9.5" }
serde = { version = "1.0.203", default-features = false, features = ["alloc", "derive"] }
toml = { version = "0.9.8", default-features = false, features = ["serde", "parse", "display"] }

[profile.dev]
panic = "abort"

[profile.dev-fast-build]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
strip = true
lto = true
# opt-level = "z"
panic = "abort"

[profile.release-fast-build]
inherits = "release"
codegen-units = 16
lto = false
incremental = false
