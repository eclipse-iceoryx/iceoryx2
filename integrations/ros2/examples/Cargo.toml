[package]
name = "iceoryx2-integrations-ros2-examples"
description = "iceoryx2-integrations: examples for the ros2 integrations"
categories = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false

[dependencies]
iceoryx2 = { workspace = true }
iceoryx2-integrations-ros2-interop = { workspace = true }

cdr = { workspace = true }
ros-env = { workspace = true, features = ["serde"] }
rosidl_runtime_rs = { workspace = true }

[lib]
path = "lib.rs"

[[example]]
name = "passthrough_prefix_mapping_publisher"
path = "passthrough_translator/prefix_mapping_publisher.rs"

[[example]]
name = "passthrough_prefix_mapping_subscriber"
path = "passthrough_translator/prefix_mapping_subscriber.rs"

[[example]]
name = "passthrough_static_mapping_publisher"
path = "passthrough_translator/static_mapping_publisher.rs"

[[example]]
name = "passthrough_static_mapping_subscriber"
path = "passthrough_translator/static_mapping_subscriber.rs"

[[example]]
name = "plain_struct_prefix_mapping_publisher"
path = "plain_struct_translator/prefix_mapping_publisher.rs"

[[example]]
name = "plain_struct_prefix_mapping_subscriber"
path = "plain_struct_translator/prefix_mapping_subscriber.rs"

[[example]]
name = "plain_struct_static_mapping_publisher"
path = "plain_struct_translator/static_mapping_publisher.rs"

[[example]]
name = "plain_struct_static_mapping_subscriber"
path = "plain_struct_translator/static_mapping_subscriber.rs"
