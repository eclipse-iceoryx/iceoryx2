# Built by colcon as an `ament_cargo` package (requires the colcon-cargo and
# colcon-ros-cargo plugins).
[workspace]

[package]
name = "demo_nodes_iceoryx2"
description = "Minimal iceoryx2 applications built as a ROS 2 package"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "publisher"
path = "src/bin/publisher.rs"

[[bin]]
name = "subscriber"
path = "src/bin/subscriber.rs"

[dependencies]
iceoryx2 = { path = "../../../../../../iceoryx2", features = ["std"] }
