# Pairs the iceoryx2 service "CmdVel" with the ROS 2 topic "/cmd_vel",
# with default QoS. Separate from static_mapping_chatter.toml: the introspection
# translator only admits fixed-size types and fails resolution for
# std_msgs/msg/String, so the chatter entry must not be in scope.

[[mapping]]
iceoryx2.service_name = "CmdVel"
iceoryx2.payload_type = "geometry_msgs/msg/Twist"
ros2.topic = "/cmd_vel"
ros2.type = "geometry_msgs/msg/Twist"
