[iceoryx2-integrations-ros2-jazzy]
image=docker.io/library/ros:jazzy
pull=true
additional_flags="--env SHELL=bash"
additional_packages="ros-dev-tools ros-jazzy-demo-nodes-cpp"
additional_packages="build-essential pkg-config libclang-dev python3-pip"
additional_packages="curl software-properties-common tmux"
init_hooks="add-apt-repository -y ppa:git-core/ppa && apt-get update && apt-get install -y git"
init_hooks="curl -sSfL https://just.systems/install.sh | bash -s -- --to /usr/local/bin"
init_hooks="curl -sSfL https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/bin"
init_hooks="echo 'export PATH=/usr/local/bin:\$PATH' >> /etc/bash.bashrc"
init_hooks="echo 'source /opt/ros/jazzy/setup.bash' >> /etc/bash.bashrc"
init_hooks="echo 'export RMW_IMPLEMENTATION=rmw_fastrtps_cpp' >> /etc/bash.bashrc"
