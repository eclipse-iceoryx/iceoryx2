[iceoryx2-integrations-ros2-humble]
image=docker.io/library/ros:humble
pull=true
additional_flags="--env SHELL=bash"
additional_packages="ros-dev-tools ros-humble-demo-nodes-cpp ros-humble-rmw-cyclonedds-cpp"
additional_packages="build-essential pkg-config libclang-dev python3-pip"
additional_packages="curl software-properties-common tmux"
init_hooks="add-apt-repository -y ppa:git-core/ppa && apt-get update && apt-get install -y git"
init_hooks="test -x /usr/local/bin/just || curl -sSfL https://just.systems/install.sh | bash -s -- --to /usr/local/bin"
init_hooks="test -x /usr/local/bin/cargo-nextest || curl -sSfL https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/bin"
init_hooks="grep -qF 'export PATH=/usr/local/bin:' /etc/bash.bashrc || echo 'export PATH=/usr/local/bin:\$PATH' >> /etc/bash.bashrc"
init_hooks="grep -qF 'source /opt/ros/humble/setup.bash' /etc/bash.bashrc || echo 'source /opt/ros/humble/setup.bash' >> /etc/bash.bashrc"
init_hooks="grep -qF 'export RMW_IMPLEMENTATION=' /etc/bash.bashrc || echo 'export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp' >> /etc/bash.bashrc"
