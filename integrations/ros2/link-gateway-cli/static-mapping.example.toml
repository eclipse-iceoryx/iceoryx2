# Example configurations for `StaticMapping`.

# Minimal mapping: only the names and types. Unset service settings and QoS
# fall back to the iceoryx2 and ROS 2 defaults.
[[mapping]]
iceoryx2.service_name = "CmdVel"
iceoryx2.payload_type = "geometry_msgs/msg/Twist"
ros2.topic = "/cmd_vel"
ros2.type = "geometry_msgs/msg/Twist"

# Full topic mapping: a publish-subscribe service paired with a ROS 2 topic.
# Unset settings and QoS fall back to the defaults.
[[mapping]]
iceoryx2.service_name = "LidarFront"
iceoryx2.payload_type = "foxglove::PointCloud"
iceoryx2.settings.max_subscribers = 8
iceoryx2.settings.max_publishers = 2
iceoryx2.settings.max_nodes = 20
iceoryx2.settings.history_size = 0
iceoryx2.settings.subscriber_max_buffer_size = 4
iceoryx2.settings.subscriber_max_borrowed_samples = 2
iceoryx2.settings.safe_overflow = true
ros2.topic = "/Lidar/Front"
ros2.type = "sensor_msgs/msg/PointCloud2"
ros2.qos.history = { KeepLast = 10 }       # or "KeepAll", "SystemDefault"
ros2.qos.reliability = "Reliable"          # or "BestEffort", "SystemDefault"
ros2.qos.durability = "Volatile"           # or "TransientLocal", "SystemDefault"
ros2.qos.liveliness = "Automatic"          # or "ManualByTopic", "SystemDefault"
ros2.qos.deadline = "500ms"                # <value><unit>; units: ns, us, ms, s
ros2.qos.lifespan = "2s"                   # unset = no bound
ros2.qos.liveliness_lease_duration = "1s"

# Full service mapping: a request-response service paired with a ROS 2 service.
# Unset settings and QoS fall back to the defaults.
[[mapping]]
iceoryx2.service_name = "AddTwoInts"
iceoryx2.request_type = "example_interfaces/srv/AddTwoInts_Request"
iceoryx2.response_type = "example_interfaces/srv/AddTwoInts_Response"
iceoryx2.settings.max_servers = 2
iceoryx2.settings.max_clients = 8
iceoryx2.settings.max_nodes = 20
iceoryx2.settings.max_active_requests_per_client = 4
iceoryx2.settings.max_response_buffer_size = 2
iceoryx2.settings.max_borrowed_responses_per_pending_response = 2
iceoryx2.settings.max_loaned_requests = 2
iceoryx2.settings.safe_overflow_for_requests = true
iceoryx2.settings.safe_overflow_for_responses = true
iceoryx2.settings.fire_and_forget_requests = false
ros2.service = "/add_two_ints"
ros2.type = "example_interfaces/srv/AddTwoInts"
ros2.qos.reliability = "Reliable"
