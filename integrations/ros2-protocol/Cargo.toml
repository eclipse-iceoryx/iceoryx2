[workspace]
resolver = "2"
members = [
    "link-adapter-zenoh",
]

[workspace.package]
categories = ["network-programming"]
edition = "2024"
homepage = "https://iceoryx.io"
keywords = [
    "zero-copy",
    "communication",
    "ipc",
    "publish-subscribe",
    "zenoh",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eclipse-iceoryx/iceoryx2"
rust-version = "1.89"
version = "0.10.999"

[workspace.dependencies]
iceoryx2-integrations-ros2-interop = { version = "0.10.999", path = "../ros2/interop" }

iceoryx2-log = { version = "0.10.999", path = "../../iceoryx2-log/log/" }
iceoryx2-bb-concurrency = { version = "0.10.999", path = "../../iceoryx2-bb/concurrency/" }
iceoryx2-bb-elementary = { version = "0.10.999", path = "../../iceoryx2-bb/elementary/" }
iceoryx2-bb-testing = { version = "0.10.999", path = "../../iceoryx2-bb/testing/" }
iceoryx2-bb-testing-macros = { version = "0.10.999", path = "../../iceoryx2-bb/testing-macros/" }
iceoryx2-link-adapter = { version = "0.10.999", path = "../../iceoryx2-link/adapter" }
iceoryx2-link-backend = { version = "0.10.999", path = "../../iceoryx2-link/backend" }
iceoryx2-link-conformance-tests = { version = "0.10.999", path = "../../iceoryx2-link/conformance-tests" }

xxhash-rust = { version = "0.8.21", default-features = false, features = ["xxh3"] }
# Mitigate https://rustsec.org/advisories/RUSTSEC-2026-0041 by not enabling
# transport_compression feature until a new version of lz4_flex is available in zenoh
zenoh = { version = "1.9.0", default-features = false, features = [
    "unstable",
    "auth_pubkey",
    "auth_usrpwd",
    "transport_multilink",
    "transport_quic",
    "transport_quic_datagram",
    "transport_tcp",
    "transport_tls",
    "transport_udp",
    "transport_unixsock-stream",
    "transport_vsock",
    "transport_ws",
] }

[profile.dev]
panic = "abort"

[profile.dev-fast-build]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
strip = true
lto = true
# opt-level = "z"
panic = "abort"

[profile.release-fast-build]
inherits = "release"
codegen-units = 16
lto = false
incremental = false
