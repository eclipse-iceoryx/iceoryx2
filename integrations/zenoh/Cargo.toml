[workspace]
resolver = "2"
members = [
    "gateway-backend",
    "gateway-cli",
]

[workspace.package]
categories = ["network-programming"]
description = "iceoryx2 integration with Zenoh"
edition = "2024"
homepage = "https://iceoryx.io"
keywords = [
    "zero-copy",
    "communication",
    "ipc",
    "publish-subscribe",
    "zenoh",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eclipse-iceoryx/iceoryx2"
rust-version = "1.89"
version = "0.9.999"

[workspace.dependencies]
iceoryx2-integrations-zenoh-gateway-cli = { version = "0.9.999", path = "gateway-cli" }
iceoryx2-integrations-zenoh-gateway-backend = { version = "0.9.999", path = "gateway-backend" }

iceoryx2 = { version = "0.9.999", path = "../../iceoryx2/" }
iceoryx2-cli = { version = "0.9.999", path = "../../iceoryx2-cli/" }
iceoryx2-log = { version = "0.9.999", path = "../../iceoryx2-log/log/" }
iceoryx2-bb-concurrency = { version = "0.9.999", path = "../../iceoryx2-bb/concurrency/" }
iceoryx2-bb-posix = { version = "0.9.999", path = "../../iceoryx2-bb/posix/" }
iceoryx2-bb-testing = { version = "0.9.999", path = "../../iceoryx2-bb/testing/" }
iceoryx2-bb-testing-macros = { version = "0.9.999", path = "../../iceoryx2-bb/testing-macros/" }
iceoryx2-gateway = { version = "0.9.999", path = "../../iceoryx2-gateway/gateway" }
iceoryx2-gateway-backend = { version = "0.9.999", path = "../../iceoryx2-gateway/backend" }
iceoryx2-gateway-conformance-tests = { version = "0.9.999", path = "../../iceoryx2-gateway/conformance-tests" }

anyhow = { version = "1.0.86" }
better-panic = { version = "0.3.0" }
clap = { version = "4.5.4", features = ["derive"] }
flume = { version = "0.12.0" }
human-panic = { version = "2.0.5" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.203", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# Mitigate https://rustsec.org/advisories/RUSTSEC-2026-0041 by not enabling
# transport_compression feature until a new version of lz4_flex is available in zenoh
zenoh = { version = "1.9.0", default-features = false, features = [
    "unstable",
    "auth_pubkey",
    "auth_usrpwd",
    "transport_multilink",
    "transport_quic",
    "transport_quic_datagram",
    "transport_tcp",
    "transport_tls",
    "transport_udp",
    "transport_unixsock-stream",
    "transport_ws",
] }

[profile.dev]
panic = "abort"

[profile.dev-fast-build]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
strip = true
lto = true
# opt-level = "z"
panic = "abort"

[profile.release-fast-build]
inherits = "release"
codegen-units = 16
lto = false
incremental = false
